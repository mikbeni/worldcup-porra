# version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: porra
      POSTGRES_USER: porra
      POSTGRES_PASSWORD: porrasecret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: