version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worldcup_porra
      POSTGRES_USER: porra
      POSTGRES_PASSWORD: porrasecret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porra"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://porra:porrasecret@postgres:5432/worldcup_porra
      ADMIN_SECRET: admin123
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && npx tsx prisma/seed.ts && npm start"

volumes:
  pgdata:
